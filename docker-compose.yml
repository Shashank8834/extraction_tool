services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Not exposed to the host — only the app talks to it over the internal network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      BASE_URL: ${BASE_URL}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
      LINK_EXPIRY_DAYS: ${LINK_EXPIRY_DAYS:-7}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    volumes:
      - uploads_data:/data/uploads
    ports:
      # BIND_HOST controls exposure:
      #   127.0.0.1 (default) -> only a reverse proxy on the box can reach it
      #   0.0.0.0             -> reachable directly at http://<server-ip>:APP_PORT
      # APP_PORT is the host port; pick a free one (see README).
      - "${BIND_HOST:-127.0.0.1}:${APP_PORT:-8000}:8000"

volumes:
  db_data:
  uploads_data:
