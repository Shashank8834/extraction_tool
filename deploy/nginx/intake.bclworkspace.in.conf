# nginx vhost for the intake tool.
#
# The app container publishes to localhost only (127.0.0.1:8011 -> 8000 in the
# container), so nginx is the only thing that reaches it. TLS is terminated
# here; certbot fills in the ssl_* lines and the :80 redirect when you run
#   sudo certbot --nginx -d intake.bclworkspace.in
#
# Install:
#   sudo cp intake.bclworkspace.in.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/intake.bclworkspace.in.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name intake.bclworkspace.in;

    # Clients upload PAN/Aadhaar/bank statements. MAX_UPLOAD_MB is 15 and a
    # submit carries several files at once; nginx's 1 MB default would reject
    # them with a bare 413 before the app ever sees the request.
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Document extraction runs inline on upload and on submit; a slow OCR
        # pass must not be cut off at nginx's 60s default.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # The app sets its own CSP / X-Frame-Options / nosniff / Referrer-Policy.
        # Do not add duplicates here — two CSP headers is the strictest of both
        # and silently breaks the page.
        proxy_buffering off;
    }
}
